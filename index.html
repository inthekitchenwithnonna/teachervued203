<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduVUE SIS | Secure Portal</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fb;color:#1c3049}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button{border:0;border-radius:8px;padding:10px 14px;background:#e8eef5;color:#153b60}button.primary{background:#1765a8;color:white}button.danger{color:#b52e40}button:disabled{opacity:.5;cursor:not-allowed}input,select{padding:10px;border:1px solid #c9d6e3;border-radius:8px;width:100%;background:white}.shell{display:flex;min-height:100vh}.side{background:#102e50;color:white;width:235px;flex-shrink:0;padding:24px 15px}.brand{font-size:24px;font-weight:800;padding:0 12px 28px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#a9c9e8}.nav{display:block;width:100%;text-align:left;background:transparent;color:#d5e4f2;margin:3px 0}.nav.active,.nav:hover{background:#24537c;color:white}.main{flex:1;min-width:0}.top{padding:18px 28px;background:white;border-bottom:1px solid #e0e8f0;display:flex;justify-content:space-between;align-items:center;gap:10px}.content{padding:30px;max-width:1300px;margin:auto}h1{margin:0 0 8px}h2{margin:0;font-size:18px}.muted{color:#63768a}.panel,.metric{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:22px;box-shadow:0 3px 12px #1a3c5e09}.panel{margin-top:20px;overflow:auto}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}.metric strong{display:block;font-size:32px;margin-top:10px}.panelhead,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{justify-content:flex-start}table{width:100%;border-collapse:collapse;min-width:600px;margin-top:14px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e9eff5;font-size:14px}th{font-size:12px;color:#66798d;text-transform:uppercase}.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#102e50,#1765a8)}.auth .panel{width:min(450px,100%);margin:0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}.notice{padding:13px 16px;background:#fff2d5;color:#785218;border-radius:9px;margin:15px 0}.error{color:#af2438}.ok{color:#197547}.modalbg{position:fixed;inset:0;background:#0a1a2bbd;display:grid;place-items:center;padding:16px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:25px}.modal .actions{justify-content:flex-end;margin-top:20px}.search{max-width:260px}.pill{padding:5px 10px;border-radius:20px;background:#e7f4ed;color:#21734d;font-size:12px}.badge{background:#e8f2fc;padding:5px 10px;border-radius:20px;color:#245b89;font-size:12px}@media(max-width:800px){.shell{display:block}.side{width:100%;padding:12px}.brand{padding:8px}.navwrap{display:flex;overflow:auto}.nav{white-space:nowrap}.top,.content{padding:17px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div id="root"></div><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
